name: gridcard
description: A new Flutter project.
publish_to: 'none' # Remove if publishing to pub.dev

version: 1.0.12+12

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Add your packages here...
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  camera: ^0.11.3
  camera_web: ^0.3.5+3
  permission_handler: ^11.3.0
  pinput: ^5.0.2
  flutter_spinkit: ^5.2.2
  fluttertoast: ^9.0.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^10.1.1
  image_picker_for_web: ^3.0.3   
  qr_flutter:  ^4.1.0
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^7.2.0
  flutter_contacts: ^1.1.9+2
  dotted_border: ^2.1.0  
  video_player: ^2.8.6
  cached_network_image: ^3.3.0 
  visibility_detector: ^0.4.0+2
  chewie: ^1.7.5 
  photo_view: ^0.15.0
  network_info_plus: ^6.0.0
  font_awesome_flutter: ^10.6.0
  change_app_package_name: ^1.5.0 
  file_picker: ^8.0.0
  universal_html: ^2.3.0
  firebase_core: ^4.5.0
  firebase_analytics: ^12.1.3
  firebase_crashlytics: ^5.0.8
  firebase_auth: ^6.2.0
  google_sign_in: ^7.2.0
  crop_your_image: ^1.1.0
  firebase_messaging: ^16.1.2
  flutter_local_notifications: ^21.0.0
  nfc_manager: ^4.1.1
  get: ^4.6.6
  app_links: ^7.0.0
  carousel_slider: ^5.0.0
  google_fonts: ^6.2.1
  flutter_staggered_grid_view: ^0.7.0
  draggable_widget: ^2.0.0
  flutter_colorpicker: ^1.0.3
  pro_image_editor: ^12.0.7  
  gal: ^2.3.0
  nfc_manager_ndef: ^1.1.0
  razorpay_flutter: ^1.4.3


  
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/app-logo.jpg"
  min_sdk_android: 21
    

flutter:
  uses-material-design: true

  assets:
    - assets/app-logo.jpg
    - assets/phone_hero.png 
    - assets/bni.png 
    - assets/jci.jpeg 
    - assets/pro.png   
    - assets/byndAi.png
  fonts:
    - family: Poppins
      fonts:
        - asset: fonts/Poppins-Regular.ttf
        - asset: fonts/Poppins-Medium.ttf
          weight: 500
        - asset: fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: fonts/Poppins-Bold.ttf
          weight: 700
