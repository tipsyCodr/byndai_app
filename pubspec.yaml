name: gridcard
description: A new Flutter project.
publish_to: 'none' # Remove if publishing to pub.dev

version: 1.0.1+3

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Add your packages here...
  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  http: ^1.5.0
  shared_preferences: ^2.5.3
  camera: ^0.11.3
  camera_web: ^0.3.5+3
  permission_handler: ^11.3.0
  pinput: ^5.0.2
  flutter_spinkit: ^5.2.2
  fluttertoast: ^9.0.0
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.2
  image_picker: ^1.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^10.1.1
  image_picker_for_web: ^3.0.3   
  qr_flutter:  ^4.1.0
  flutter_svg: ^2.0.10+1
  mobile_scanner: ^5.0.1
  flutter_contacts: ^1.1.9+2
  dotted_border: ^2.1.0  
  video_player: ^2.8.6
  cached_network_image: ^3.3.0 
  chewie: ^1.7.5 
  photo_view: ^0.15.0
  network_info_plus: ^6.0.0
  font_awesome_flutter: ^10.6.0
  change_app_package_name: ^1.5.0 
  file_picker: ^8.0.0

  
dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app-logo.jpg"
  min_sdk_android: 21
    

flutter:
  uses-material-design: true

  assets:
    - assets/app-logo.jpg
    - assets/phone_hero.png    
    - assets/byndAi.png
